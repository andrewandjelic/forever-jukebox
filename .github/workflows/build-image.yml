name: Build image

# Runs on every push to main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The job's token may read the code and publish packages, nothing else.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest  # amd64, which the Dockerfile's runtime stage requires
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ponytail: no layer cache, so every build pulls the current yt-dlp nightly;
      # add cache-from/cache-to type=gha if builds get too slow.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
